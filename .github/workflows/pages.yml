name: Build and publish the web book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the book
        uses: actions/checkout@v6
      - name: Set up Quarto and TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: '1.10.18'
          tinytex: true
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Ensure the PDF code font is installed
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
      - name: Render HTML and combined PDF
        run: quarto render
      - name: Check local links and source structure
        run: python3 scripts/check_book.py
      - name: Disable Jekyll
        run: touch _site/.nojekyll
      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
